services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pharmacomplaint
      POSTGRES_PASSWORD: pharmacomplaint
      POSTGRES_DB: pharmacomplaint_complaints
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://pharmacomplaint:pharmacomplaint@db:5432/pharmacomplaint_complaints
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/app:/app/app

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_BASE: http://localhost:8000
      REACT_APP_BUILD: "v2"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  db_data:
